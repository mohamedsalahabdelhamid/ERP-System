# Nginx serving the built ERP SPA and proxying API calls to the
# backend `web` service (same Compose network).
#
# Local run: http://localhost:9009
# On a real server put this behind a TLS terminator (Caddy/Traefik/cloud LB)
# that terminates HTTPS and forwards to port 80 — no app changes required.

# Redirect HTTP -> HTTPS (uncomment when a TLS terminator is configured).
# server {
#     listen 80 default_server;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reasonable upload ceiling for documents/imports.
    client_max_body_size 25m;

    # Basic compression for the JS/CSS bundles.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- Security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-XSS-Protection "0" always;
    # When serving the SPA itself over HTTPS (with a TLS terminator), you can
    # tighten CSP further. This baseline CSP keeps the Vite-built SPA working.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # ---- API -> FastAPI backend (keeps the /api/v1 prefix) ----
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Lightweight endpoint for external uptime checks.
    location = /health {
        proxy_pass http://web:8000/health;
        access_log off;
    }

    # SPA fallback: serve index.html for any client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
